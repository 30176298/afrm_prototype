name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # GCC on Linux: build, test, static analysis
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          ninja-build cppcheck libx11-dev libxrandr-dev libxinerama-dev
          libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure, build, test
        run: |
          cmake --preset gcc-release
          cmake --build --preset gcc-release
          ctest --preset gcc-release
      - name: Static analysis
        run: >
          cppcheck --enable=warning,style,performance --error-exitcode=1
          --inline-suppr --suppress=missingIncludeSystem --suppress=unknownMacro
          -I src src tests

  # AddressSanitizer + UBSan
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build, test
        run: |
          cmake --preset asan -DAFRM_BUILD_GUI=OFF
          cmake --build --preset asan
          ctest --preset asan

  # MSVC: second compiler
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          cmake --preset msvc
          cmake --build --preset msvc
          ctest --preset msvc
      - uses: actions/upload-artifact@v4
        with:
          name: afrm-windows-msvc
          path: build/msvc/Release/afrm.exe

  # same toolchain as development machine: MSYS2 UCRT64 GCC
  windows-gcc:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure, build, test
        run: |
          cmake --preset gcc-release
          cmake --build --preset gcc-release
          ctest --preset gcc-release
      - uses: actions/upload-artifact@v4
        with:
          name: afrm-windows-gcc
          path: build/gcc-release/afrm.exe
